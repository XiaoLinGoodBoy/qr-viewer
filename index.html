<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3Dモデルビューア</title>
<style>
  :root {
    --bar-bg: #0b3d66;
    --bar-fg: #ffffff;
    --muted: #b9cde0;
    --error: #ffb4a8;
    --btn-bg: rgba(255, 255, 255, 0.14);
    --btn-border: rgba(255, 255, 255, 0.35);
    --page-bg: #eef1f5;
    --panel-bg: #ffffff;
    --panel-fg: #1f2933;
    --panel-muted: #5f6b7a;
    --panel-border: #d0d5db;
    --row-hover: #eef3f8;
    --row-active-bg: #0b3d66;
    --row-active-fg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page-bg); }
  body {
    display: flex; flex-direction: column;
    font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif;
  }
  header {
    flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 16px; padding-top: max(8px, env(safe-area-inset-top));
    background: var(--bar-bg); color: var(--bar-fg); font-size: 14px;
  }
  #status { flex: 1 1 200px; min-width: 0; line-height: 1.4; }
  #status small { display: block; color: var(--muted); font-size: 12px; }
  #status.error { color: var(--error); }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%; flex: none;
    border: 2px solid var(--btn-border); border-top-color: var(--bar-fg);
    animation: spin 0.9s linear infinite;
  }
  .spinner[hidden] { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  header button, header a {
    flex: none; font: inherit; font-size: 13px; color: var(--bar-fg); text-decoration: none;
    background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: 4px;
    padding: 6px 10px; cursor: pointer;
  }
  header button[hidden], header a[hidden] { display: none; }
  header button[aria-pressed="true"] { background: #ffffff; color: var(--bar-bg); border-color: #ffffff; }
  #content { flex: 1; min-height: 0; display: flex; }
  iframe { flex: 1; min-width: 0; border: 0; background: var(--page-bg); }
  #panel {
    flex: none; width: 260px; overflow: auto; padding: 8px;
    background: var(--panel-bg); color: var(--panel-fg);
    border-left: 1px solid var(--panel-border); font-size: 14px;
  }
  #panel[hidden] { display: none; }
  #panel summary { display: flex; align-items: center; gap: 4px; cursor: pointer; list-style: none; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::before { content: "▶"; flex: none; width: 16px; font-size: 10px; color: var(--panel-muted); text-align: center; }
  #panel details[open] > summary::before { content: "▼"; }
  #panel ul { list-style: none; margin: 0 0 8px; padding: 0 0 0 20px; }
  #panel .row {
    width: 100%; display: flex; justify-content: space-between; gap: 8px; min-height: 32px; align-items: center;
    padding: 4px 8px; font: inherit; color: inherit; text-align: left; overflow-wrap: anywhere;
    background: none; border: 0; border-radius: 4px; cursor: pointer;
  }
  #panel .row:hover { background: var(--row-hover); }
  #panel .row.active { background: var(--row-active-bg); color: var(--row-active-fg); }
  #panel .assembly { font-weight: 600; }
  #panel .bolts { margin-left: 20px; }
  #panel .bolts > summary { min-height: 32px; font-weight: 600; }
  #panel .option {
    display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px 8px; margin-bottom: 8px;
    border-bottom: 1px solid var(--panel-border); color: var(--panel-muted); font-size: 13px; cursor: pointer;
  }
  #panel .count { flex: none; font-weight: 400; font-size: 12px; opacity: 0.75; }
  @media (max-width: 700px) {
    #content { flex-direction: column; }
    #panel { width: 100%; max-height: 40vh; border-left: 0; border-top: 1px solid var(--panel-border); }
  }
  #debug {
    flex: none; max-height: 40vh; overflow: auto; margin: 0; padding: 8px 16px;
    background: #111; color: #cfe; font: 12px/1.4 Consolas, monospace; white-space: pre-wrap;
  }
  #debug[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <div class="spinner" id="spinner"></div>
  <div id="status">準備しています…</div>
  <button id="btnList" type="button" aria-controls="panel" hidden>部材リスト</button>
  <button id="btnFocus" type="button" hidden>対象を表示</button>
  <button id="btnSame" type="button" hidden title="同じ製品符号の製品をすべて表示します">同一符号を表示</button>
  <button id="btnDim" type="button" hidden aria-pressed="false" title="Trimble Connect に公開した製品図の寸法を表示します">寸法表示</button>
  <button id="btnAll" type="button" hidden>全体を表示</button>
  <a id="lnkOpen" target="_blank" rel="noopener" hidden>Trimble Connect で開く</a>
</header>
<div id="content">
  <iframe id="viewer" title="Trimble Connect 3D ビューア" allow="fullscreen; xr-spatial-tracking"></iframe>
  <aside id="panel" aria-label="製品と部材のマーク" hidden>
    <label class="option"><input id="chkZoom" type="checkbox">クリックした部材にズーム</label>
  </aside>
</div>
<pre id="debug" hidden></pre>

<script src="https://cdn.jsdelivr.net/npm/trimble-connect-workspace-api@0.3.38/dist/iife/trimbleconnect.workspace.api.js"></script>
<script>
/*
 * QR コード用中継ページ
 *
 * パラメータ:
 *   pid    Trimble Connect プロジェクト ID（必須）
 *   mid    モデル（ファイル）ID（必須）
 *   stoken 共有トークン（公開リンク）。無い場合は Trimble Connect のビューアへそのまま移動する
 *   org    共有リンクの発行元ホスト（例: app21.connect.trimble.com）
 *   guid   製品の IFC GUID（22 文字、; 区切りで複数可）。指定されていればこれで 1 個だけを特定し、
 *          見つからない場合は apos / ppos で検索する（製品トレースの QR コード）
 *   sn     同一符号内の通し番号（例: 1/3）。表示用
 *   apos   製品マーク（; 区切り、? は任意の 1 文字、* は任意の文字列）
 *   ppos   部材マーク（同上）
 *   iso=1  対象以外を非表示にする
 *   ap/pp  照合するプロパティ名を明示する（既定は自動判定）
 *   mode   api（既定）| url  埋め込み方式
 *   debug=1 プロパティ名などの診断情報を表示
 */
(function () {
  "use strict";

  // パラメータは「#」以降（フラグメント）から読む。フラグメントはサーバーへ送信されないため、
  // 共有トークンがホスティング側のアクセスログに残らない。旧形式の「?」以降にも対応する。
  const q = new URLSearchParams(location.search);
  new URLSearchParams(location.hash.replace(/^#/, "")).forEach((value, key) => q.set(key, value));
  const pid = q.get("pid") || "";
  const mid = q.get("mid") || "";
  const stoken = q.get("stoken") || "";
  const org = q.get("org") || "";
  const guids = splitPatterns(q.get("guid"));
  const serial = (q.get("sn") || "").trim();
  const apos = splitPatterns(q.get("apos"));
  const ppos = splitPatterns(q.get("ppos"));
  const isolate = q.get("iso") === "1";
  const mode = q.get("mode") === "url" ? "url" : "api";
  const debugOn = q.get("debug") === "1";
  const apName = q.get("ap");
  const ppName = q.get("pp");

  const ASSEMBLY_PROPS = /^(assembly\/cast unit mark|assembly[ _]?(pos|position|mark)|cast ?unit ?(mark|pos)|製品(符号|番号))$/i;
  const PART_PROPS = /^(part[ _]?(pos|position|mark)|preliminary mark|部材(符号|番号))$/i;

  const el = {
    status: document.getElementById("status"),
    spinner: document.getElementById("spinner"),
    frame: document.getElementById("viewer"),
    list: document.getElementById("btnList"),
    panel: document.getElementById("panel"),
    zoom: document.getElementById("chkZoom"),
    focus: document.getElementById("btnFocus"),
    same: document.getElementById("btnSame"),
    dim: document.getElementById("btnDim"),
    all: document.getElementById("btnAll"),
    open: document.getElementById("lnkOpen"),
    debug: document.getElementById("debug"),
  };

  const viewerUrl = buildViewerUrl();
  el.open.href = viewerUrl;

  let api = null;
  let matched = [];
  const markTree = new Map();
  const assemblyEntities = new Map();
  const objectsById = new Map();

  const MAX_LABELS = 30;
  const NO_MARK = "マークなし";
  const BOLT_GROUP = "ボルト";
  // モデルに強度等級が無いため、NAME の種類から換算する（TCB: トルシア形高力ボルト、HTB: 高力六角ボルト）
  const BOLT_GRADES = { TCB: "S10T", HTB: "F10T" };
  const HIERARCHY_ELEMENT_ASSEMBLY = 4;
  const METERS_TO_MM = 1000;
  const LABEL_MIN_LEADER_MM = 100;
  const LABEL_MAX_LEADER_MM = 500;
  const ASSEMBLY_LABEL_COLOR = { r: 255, g: 20, b: 147, a: 255 };
  const PART_LABEL_COLOR = { r: 0, g: 0, b: 255, a: 255 };
  const markLabel = [apos.join(", "), ppos.join(", ")].filter(Boolean).join(" / ");
  // 個体を指定した QR では「G1-2 (1/3)」のように通し番号も表示する
  const label = markLabel && serial ? markLabel + " (" + serial + ")" : (markLabel || (guids.length ? "GUID " + guids.join(", ") : ""));

  function splitPatterns(value) {
    return (value || "").split(";").map(s => s.trim()).filter(Boolean);
  }

  function buildViewerUrl() {
    let url = "https://web.connect.trimble.com/projects/" + encodeURIComponent(pid) +
      "/viewer/3d/?modelId=" + encodeURIComponent(mid);
    if (org) url += "&origin=" + encodeURIComponent(org);
    if (stoken) url += "&stoken=" + encodeURIComponent(stoken);
    return url;
  }

  function setStatus(text, sub, isError) {
    el.status.className = isError ? "error" : "";
    el.status.textContent = text;
    if (sub) {
      const s = document.createElement("small");
      s.textContent = sub;
      el.status.appendChild(s);
    }
  }

  function busy(on) { el.spinner.hidden = !on; }

  const startedAt = performance.now();
  function log(...args) {
    if (!debugOn) return;
    el.debug.hidden = false;
    el.debug.textContent += "[" + ((performance.now() - startedAt) / 1000).toFixed(1) + "s] " + args.map(a => typeof a === "string" ? a : JSON.stringify(a, null, 1)).join(" ") + "\n";
  }

  function fail(text, err) {
    busy(false);
    setStatus(text, err ? String(err && err.message || err) : "", true);
    el.open.hidden = false;
    log("ERROR:", text, String(err && err.stack || err || ""));
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function withTimeout(promise, ms, what) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(what + " がタイムアウトしました")), ms)),
    ]);
  }

  function toRegex(pattern) {
    const body = pattern.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\?/g, ".").replace(/\*/g, ".*");
    return new RegExp("^" + body + "$", "i");
  }

  // ---- 埋め込み ----

  async function connectViewer() {
    if (mode === "url") {
      el.frame.src = viewerUrl + "&isEmbedded=true";
      api = await TrimbleConnectWorkspace.connect(el.frame, onEvent, 60000);
      return;
    }
    el.frame.src = "https://web.connect.trimble.com/?isEmbedded=true";
    api = await TrimbleConnectWorkspace.connect(el.frame, onEvent, 60000);
    await api.embed.setTokens({ shareToken: stoken });
    await api.embed.init3DViewer({ projectId: pid, modelId: mid });
  }

  const NOISY_EVENTS = /onCameraChanged|onSelectionChanged|onPicked|onPresentationChanged|onMarkupChanged/;

  // viewer.onModelStateChanged で対象モデルが "loaded" になったら解決する
  let resolveModelLoaded;
  let rejectModelLoaded;
  let modelLoadFailed = false;
  const modelLoaded = new Promise((resolve, reject) => { resolveModelLoaded = resolve; rejectModelLoaded = reject; });
  modelLoaded.catch(() => { /* waitForModel で処理する */ });

  // 共有に含めた寸法ファイル（.trb）はビューアが自動で読み込むため、モデル以外は閉じておく
  // （寸法はボタンで必要な図面だけを表示する）。ボタンで開いたものは閉じない。
  const allowedModels = new Set();
  function hideExtraModel(m) {
    if (!m || !m.id || m.id === mid || allowedModels.has(m.id) || !api) return;
    if (m.state !== "loaded" && m.state !== "loading") return;
    api.viewer.toggleModel(m.id, false, false)
      .then(() => log("共有ファイルを閉じました:", m.name || m.id))
      .catch(e => log("共有ファイルを閉じられません:", String(e && e.message || e)));
  }

  function onEvent(event, data) {
    if (event === "viewer.onModelStateChanged") {
      const m = data && data.data;
      hideExtraModel(m);
      if (m && m.id === mid && m.state === "loaded") resolveModelLoaded();
      if (m && m.id === mid && m.state === "loadingFailed") {
        modelLoadFailed = true;
        rejectModelLoaded(new Error("モデルの読み込みに失敗しました"));
      }
    }
    if (event === "viewer.onSelectionChanged") onSelectionChanged(data && data.data);
    if (NOISY_EVENTS.test(event)) return;
    log("event:", event, data && data.data !== undefined ? data.data : "");
  }

  async function waitForModel(timeoutMs) {
    // getModels("loaded") は読み込み完了前に返ることがあるため、状態変更イベントを待つ
    try {
      await withTimeout(modelLoaded, timeoutMs, "モデルの読み込み");
    } catch (e) {
      if (modelLoadFailed) throw e;
      // イベントを取り逃した場合もあるので、オブジェクト取得の再試行に任せる
      log("loaded イベントを受信できませんでした。続行します。");
    }
  }

  // ---- 対象の検索 ----

  const PROPERTY_BATCH = 200;

  /** プロパティなしでオブジェクトの一覧（ランタイム ID）だけを取得する。 */
  async function fetchObjectIds() {
    const t0 = Date.now();
    const result = await withTimeout(api.viewer.getObjects(), 30000, "オブジェクト一覧の取得");
    const group = (result || []).find(r => r.modelId === mid) || (result || [])[0];
    const ids = group ? (group.objects || []).map(o => o.id) : [];
    log(`getObjects: ${ids.length} 件 (${Date.now() - t0} ms)`,
      result && result.length > 1 ? "models=" + result.map(r => r.modelId).join(",") : "");
    return ids;
  }

  async function loadObjectsWithProperties() {
    // 読み込み直後はオブジェクトがまだ空のことがあるので、取得できるまで待つ
    let ids = [];
    for (let attempt = 0; attempt < 20 && !ids.length; attempt++) {
      try {
        ids = await fetchObjectIds();
      } catch (e) {
        log("getObjects 失敗:", String(e && e.message || e));
      }
      if (!ids.length) await sleep(1500);
    }
    if (!ids.length) throw new Error("モデルのオブジェクトを取得できませんでした");

    // プロパティは分割して取得する（一度に全件を要求すると応答が返らないことがある）
    const objects = [];
    const t0 = Date.now();
    for (let i = 0; i < ids.length; i += PROPERTY_BATCH) {
      const batch = ids.slice(i, i + PROPERTY_BATCH);
      setStatus("オブジェクト情報を取得しています…", `${Math.min(i + PROPERTY_BATCH, ids.length)} / ${ids.length}`);
      try {
        objects.push(...await withTimeout(api.viewer.getObjectProperties(mid, batch), 30000, "プロパティの取得"));
      } catch (e) {
        log(`getObjectProperties 失敗 (${i}～):`, String(e && e.message || e));
      }
    }
    log(`getObjectProperties: ${objects.length} 件 (${Date.now() - t0} ms)`);
    return objects;
  }

  function flatProps(obj) {
    const out = [];
    for (const set of obj.properties || []) {
      for (const p of set.properties || []) {
        out.push({ set: set.name || "", name: p.name || "", value: p.value });
      }
    }
    return out;
  }

  const classOf = obj => String(obj.class || "").toUpperCase();
  const isAssemblyEntity = obj => classOf(obj) === "IFCELEMENTASSEMBLY";
  const isBolt = obj => classOf(obj) === "IFCMECHANICALFASTENER";

  /** 製品マーク → 部材マーク → オブジェクト ID の木に追加する。 */
  function addToMarkTree(assemblyMark, partMark, obj) {
    const id = obj.id;
    const aKey = assemblyMark || NO_MARK;
    if (!markTree.has(aKey)) markTree.set(aKey, { ids: [], parts: new Map(), bolts: new Map() });
    const node = markTree.get(aKey);
    node.ids.push(id);
    // 製品そのものの実体は部材の一覧に含めない（選択すると配下の部材とボルトも強調される）
    if (isAssemblyEntity(obj)) return;
    const pKey = partMark || NO_MARK;
    if (!node.parts.has(pKey)) node.parts.set(pKey, []);
    node.parts.get(pKey).push(id);
  }

  /** オブジェクトの種類（クラス）ごとの件数と、1 件分のプロパティを診断表示する。 */
  function logNoMarkSamples(objects, ids) {
    if (!debugOn) return;
    const matchedIds = new Set(ids);
    const byClass = new Map();
    for (const obj of objects) {
      const key = String(obj.class || "（クラスなし）");
      if (!byClass.has(key)) byClass.set(key, { total: 0, matched: 0, sample: obj });
      const entry = byClass.get(key);
      entry.total++;
      if (matchedIds.has(obj.id)) {
        if (!entry.matched) entry.sample = obj;
        entry.matched++;
      }
    }
    log("クラス別:", Array.from(byClass.entries()).map(([k, v]) => `${k} 全体${v.total} 対象${v.matched}`));
    for (const [key, { sample }] of byClass) {
      log("--- " + key + " ---");
      log(flatProps(sample).map(p => p.name + " = " + p.value).join("\n"));
    }
  }

  function findMatches(objects) {
    const aRegex = apos.map(toRegex);
    const pRegex = ppos.map(toRegex);
    const aTest = apName ? n => n.toLowerCase() === apName.toLowerCase() : n => ASSEMBLY_PROPS.test(n);
    const pTest = ppName ? n => n.toLowerCase() === ppName.toLowerCase() : n => PART_PROPS.test(n);

    const allRegex = aRegex.concat(pRegex);
    const valueOf = p => String(p.value == null ? "" : p.value).trim();

    // 1. マーク用のプロパティ名で照合する
    const ids = [];
    const seenNames = new Set();
    const setNames = new Set();
    const marksById = new Map();
    for (const obj of objects) {
      let assemblyMark = "";
      let partMark = "";
      for (const p of flatProps(obj)) {
        setNames.add(p.set);
        if (/mark|pos|符号|番号/i.test(p.name)) seenNames.add(p.set + " / " + p.name);
        const value = valueOf(p);
        if (!value) continue;
        if (aTest(p.name)) assemblyMark = value;
        if (pTest(p.name)) partMark = value;
      }
      marksById.set(obj.id, { assemblyMark, partMark });
      objectsById.set(obj.id, obj);
      if (assemblyMark && isAssemblyEntity(obj)) {
        if (!assemblyEntities.has(assemblyMark)) assemblyEntities.set(assemblyMark, []);
        assemblyEntities.get(assemblyMark).push(obj.id);
      }
      const assemblyHit = assemblyMark && aRegex.some(r => r.test(assemblyMark));
      const partHit = partMark && pRegex.some(r => r.test(partMark));
      if (assemblyHit || partHit) {
        ids.push(obj.id);
        addToMarkTree(assemblyMark, partMark, obj);
      }
    }

    log("== 診断 ==");
    log("オブジェクト数:", objects.length, " プロパティ付き:", objects.filter(o => o.properties && o.properties.length).length);
    log("プロパティセット:", Array.from(setNames).slice(0, 40));
    log("マークらしいプロパティ:", Array.from(seenNames).slice(0, 40));
    log("名前で一致:", ids.length);
    logNoMarkSamples(objects, ids);

    if (ids.length) return ids;

    // 2. 見つからない場合は、どのプロパティでも値が一致するものを探す
    const hitNames = new Map();
    for (const obj of objects) {
      for (const p of flatProps(obj)) {
        const value = valueOf(p);
        if (value && allRegex.some(r => r.test(value))) {
          ids.push(obj.id);
          const marks = marksById.get(obj.id);
          addToMarkTree(marks.assemblyMark || value, marks.partMark, obj);
          const key = p.set + " / " + p.name;
          hitNames.set(key, (hitNames.get(key) || 0) + 1);
          break;
        }
      }
    }
    log("値で一致:", ids.length, Array.from(hitNames.entries()));
    if (debugOn && objects.length) {
      const sample = objects.find(o => o.properties && o.properties.length) || objects[0];
      log("サンプル（先頭部分）:", JSON.stringify(sample).slice(0, 3000));
    }
    return ids;
  }

  // ---- GUID による特定（製品トレースの QR コード） ----

  const IFC_GUID_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_$";
  // 一覧に表示する製品名（「G1-2 (1/3)」など）。キーは markTree のキー
  const displayNames = new Map();

  /** IFC の GlobalId（22 文字）を UUID 形式（8-4-4-4-12）に戻す。形式が違えば null。 */
  function ifcGuidToUuid(g) {
    if (!/^[0-9A-Za-z_$]{22}$/.test(g)) return null;
    let n = 0n;
    for (const c of g) n = n * 64n + BigInt(IFC_GUID_CHARS.indexOf(c));
    const hex = n.toString(16).padStart(32, "0");
    if (hex.length !== 32) return null;
    return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join("-");
  }

  /**
   * GUID からビューアのランタイム ID を求める。外部 ID の形式はファイルの種類で異なるため、
   * IFC GlobalId（22 文字）→ UUID（小文字）→ UUID（大文字）の順に試す。
   */
  async function resolveGuids() {
    const found = [];
    for (const g of guids) {
      const uuid = ifcGuidToUuid(g);
      const candidates = [g, uuid, uuid && uuid.toUpperCase()].filter(Boolean);
      for (const candidate of candidates) {
        try {
          const ids = await withTimeout(api.viewer.convertToObjectRuntimeIds(mid, [candidate]), 20000, "GUID の変換");
          log("convertToObjectRuntimeIds: " + candidate + " → " + JSON.stringify(ids));
          const id = ids && ids[0];
          if (typeof id === "number" && id >= 0) {
            found.push(id);
            break;
          }
        } catch (e) {
          log("convertToObjectRuntimeIds 失敗:", candidate, String(e && e.message || e));
        }
      }
    }
    return Array.from(new Set(found));
  }

  /** プロパティから製品マーク・部材マークを読む。 */
  function marksOf(obj) {
    const aTest = apName ? n => n.toLowerCase() === apName.toLowerCase() : n => ASSEMBLY_PROPS.test(n);
    const pTest = ppName ? n => n.toLowerCase() === ppName.toLowerCase() : n => PART_PROPS.test(n);
    let assemblyMark = "";
    let partMark = "";
    for (const p of flatProps(obj)) {
      const value = String(p.value == null ? "" : p.value).trim();
      if (!value) continue;
      if (aTest(p.name)) assemblyMark = value;
      if (pTest(p.name)) partMark = value;
    }
    return { assemblyMark, partMark };
  }

  async function getProperties(ids) {
    const objects = [];
    for (let i = 0; i < ids.length; i += PROPERTY_BATCH) {
      objects.push(...await withTimeout(
        api.viewer.getObjectProperties(mid, ids.slice(i, i + PROPERTY_BATCH)), 30000, "プロパティの取得"));
    }
    return objects;
  }

  /**
   * GUID で製品（IfcElementAssembly）を特定し、その製品の部材・ボルトだけを対象にする。
   * モデル全体のプロパティを読まないので、マーク検索より速い。見つからなければ空配列。
   */
  async function findByGuid() {
    const roots = await resolveGuids();
    if (!roots.length) return [];

    let children = [];
    try {
      children = await withTimeout(
        api.viewer.getHierarchyChildren(mid, roots, HIERARCHY_ELEMENT_ASSEMBLY, true), 30000, "構成部材の取得");
    } catch (e) {
      log("getHierarchyChildren 失敗:", String(e && e.message || e));
    }
    const ids = Array.from(new Set(roots.concat((children || []).map(c => c.id))));
    const objects = await getProperties(ids);
    log("GUID で特定: ランタイム ID " + roots.join(",") + "・構成 " + (ids.length - roots.length) + " 件");

    // 製品の実体のマークを一覧の見出しにする（無ければ QR の apos）
    const rootObj = objects.find(o => roots.includes(o.id));
    if (rootObj) {
      log("特定した製品:", String(rootObj.class || ""), flatProps(rootObj)
        .filter(p => /guid|assembly_pos|製品符号/i.test(p.name)).map(p => p.name + "=" + p.value).join(", "));
    }
    const rootMark = (rootObj && marksOf(rootObj).assemblyMark) || apos[0] || NO_MARK;
    displayNames.set(rootMark, serial ? rootMark + " (" + serial + ")" : rootMark);
    assemblyEntities.set(rootMark, roots);
    for (const obj of objects) {
      objectsById.set(obj.id, obj);
      if (isBolt(obj)) continue;  // ボルトは loadBolts で規格ごとにまとめる
      addToMarkTree(rootMark, marksOf(obj).partMark, obj);
    }
    return ids;
  }

  /** 同じ製品符号の製品をすべて探す（「同一符号を表示」ボタン用）。結果はキャッシュする。 */
  let sameMarkIds = null;
  async function findSameMark() {
    if (sameMarkIds) return sameMarkIds;
    const regex = apos.map(toRegex);
    const objects = await loadObjectsWithProperties();
    for (const obj of objects) objectsById.set(obj.id, obj);
    sameMarkIds = objects
      .filter(obj => { const m = marksOf(obj).assemblyMark; return m && regex.some(r => r.test(m)); })
      .map(obj => obj.id);
    return sameMarkIds;
  }

  async function showSameMark() {
    busy(true);
    setStatus("同じ製品符号の製品を検索しています…", "製品符号: " + markLabel);
    try {
      const ids = await findSameMark();
      busy(false);
      if (!ids.length) {
        setStatus("同じ製品符号の製品が見つかりませんでした", "製品符号: " + markLabel, true);
        return;
      }
      setActiveRow(null);
      selectionRequest++;
      await clearLabels();
      await api.viewer.setSelection(selector(ids), "set");
      if (isolate) await api.viewer.isolateEntities([{ modelId: mid, entityIds: ids }]);
      await api.viewer.setCamera(selector(ids));
      const products = ids.filter(id => {
        const obj = objectsById.get(id);
        return obj ? isAssemblyEntity(obj) : false;
      }).length;
      setStatus(markLabel + " をすべて表示しています",
        (products ? "製品 " + products + " 個・" : "") + "「対象を表示」でスキャンした製品に戻ります");
    } catch (e) {
      fail("同じ製品符号の製品を表示できませんでした。", e);
    }
  }

  // ---- 製品図の寸法（「Publish drawing annotations to Trimble Connect」で公開した注釈） ----
  //
  // 公開ツールは Trimble Connect の「…\モデル名\Annotations」に Annotations_Index.json と
  // 図面ごとの .trb（3D 配置済みの寸法・文字）を置く。索引の各図面には、図面に描かれたオブジェクトの
  // IFC GUID（mainObjects / modelObjectDrawingObjects）があるので、表示中の製品の GUID と照合する。
  // 共有リンクの範囲に Annotations フォルダーが含まれていないと読めないため、その場合はボタンを出さない。

  const ANNOTATION_INDEX = "annotations_index.json";
  const tcApi = "https://" + (org || "app.connect.trimble.com") + "/tc/api/2.0";
  let annotation = null;      // { id, name, fileId } 表示できる製品図
  let annotationLoaded = false;
  let annotationVisible = false;

  async function tcGet(path, token) {
    const r = await withTimeout(fetch(tcApi + path, { headers: { Authorization: "Bearer " + token } }), 20000, "Trimble Connect API");
    if (!r.ok) throw new Error(path.replace(/[A-Za-z0-9_-]{11}/g, "{id}") + " → HTTP " + r.status);
    return r.json();
  }

  async function folderItems(folderId, token) {
    const items = await tcGet("/folders/" + encodeURIComponent(folderId) + "/items", token);
    return Array.isArray(items) ? items : [];
  }

  async function downloadUrl(fileId, token) {
    const r = await tcGet("/files/fs/" + encodeURIComponent(fileId) + "/downloadurl", token);
    if (!r || !r.url) throw new Error("ダウンロード URL を取得できません");
    return r.url;
  }

  /**
   * 共有に含まれる範囲から、このモデルの Annotations フォルダー（索引ファイルを含むもの）を探す。
   * 公開ツールの配置は「…\Tekla Models\モデル名\Annotations」。共有したフォルダーに別のモデルも入っている
   * 場合があるので、モデル名のフォルダーを優先し、索引の modelName がこのモデルと一致するものだけを使う。
   */
  async function findAnnotationsFolder(share, token) {
    const candidates = [];
    let modelName = "";
    const sharedFile = (share.objects || []).find(o => o.id === mid);
    if (sharedFile && sharedFile.name) modelName = sharedFile.name;
    // 1. モデルファイルと同じフォルダー
    try {
      const file = await tcGet("/files/" + encodeURIComponent(mid), token);
      if (file && file.name) modelName = file.name;
      if (file && file.parentId) candidates.push(file.parentId);
    } catch (e) {
      log("モデルのフォルダー情報を取得できません:", String(e.message || e));
    }
    modelName = modelName.replace(/\.[^.]+$/, "");  // 「新規モデル2025_Sub.tekla」→「新規モデル2025_Sub」
    // 2. 共有に含まれるフォルダー
    for (const o of share.objects || []) {
      if (o.type === "FOLDER") candidates.push(o.id);
    }
    const visited = new Set();
    const queue = candidates.map(id => ({ id, depth: 0 }));
    while (queue.length) {
      const { id, depth } = queue.shift();
      if (visited.has(id)) continue;
      visited.add(id);
      let items;
      try {
        items = await folderItems(id, token);
      } catch (e) {
        log("フォルダーを読めません:", String(e.message || e));
        continue;
      }
      const indexFile = items.find(i => i.type === "FILE" && String(i.name).toLowerCase() === ANNOTATION_INDEX);
      if (indexFile) {
        try {
          const index = await (await fetch(await downloadUrl(indexFile.id, token))).json();
          if (!modelName || !index.modelName || index.modelName === modelName) {
            return {
              folderId: id, index, items,
              findTrb: async drawing => {
                const sub = items.find(i => i.type === "FOLDER" && String(i.name).toLowerCase() === String(drawing.folder || "").toLowerCase());
                const files = sub ? await folderItems(sub.id, token) : items;
                return files.find(i => i.type === "FILE" && i.name === drawing.file) || null;
              }
            };
          }
          log("寸法: 別のモデルの索引のため使いません:", index.modelName);
        } catch (e) {
          log("寸法: 索引を読めません:", String(e.message || e));
        }
      }
      if (depth >= 3) continue;
      for (const i of items) {
        if (i.type !== "FOLDER") continue;
        // このモデル名のフォルダーと Annotations フォルダーを優先して探す
        const entry = { id: i.id, depth: depth + 1 };
        if (i.name === modelName || /^annotations$/i.test(i.name)) queue.unshift(entry); else queue.push(entry);
      }
    }
    return null;
  }

  /** 共有に含まれるファイルから索引を探す（索引の modelName がこのモデルと一致するもの）。 */
  async function findAnnotationsInShare(share, token) {
    const files = (share.objects || []).filter(o => o.type === "FILE");
    const modelFile = files.find(o => o.id === mid);
    const modelName = modelFile && modelFile.name ? String(modelFile.name).replace(/\.[^.]+$/, "") : "";
    for (const f of files.filter(o => String(o.name).toLowerCase() === ANNOTATION_INDEX)) {
      try {
        const index = await (await fetch(await downloadUrl(f.id, token))).json();
        if (modelName && index.modelName && index.modelName !== modelName) {
          log("寸法: 別のモデルの索引のため使いません:", index.modelName);
          continue;
        }
        return { index, findTrb: async drawing => files.find(o => o.name === drawing.file) || null };
      } catch (e) {
        log("寸法: 索引を読めません:", String(e.message || e));
      }
    }
    return null;
  }

  /** 表示中の製品（とその部材）の IFC GUID を集める。 */
  async function productGuids(ids) {
    const guids = new Set();
    for (let i = 0; i < ids.length; i += PROPERTY_BATCH) {
      try {
        const batch = await withTimeout(api.viewer.convertToObjectIds(mid, ids.slice(i, i + PROPERTY_BATCH)), 20000, "GUID の取得");
        for (const g of batch || []) if (g) guids.add(String(g));
      } catch (e) {
        log("convertToObjectIds 失敗:", String(e.message || e));
      }
    }
    for (const g of guids) {
      const uuid = ifcGuidToUuid(g);
      if (uuid) guids.add(uuid.toLowerCase());
    }
    return guids;
  }

  /** 製品図の寸法が公開されていれば「寸法表示」ボタンを出す（見つからなければ何もしない）。 */
  async function checkAnnotations(ids) {
    try {
      const shareResponse = await withTimeout(fetch(tcApi + "/shares/token/" + encodeURIComponent(stoken)), 20000, "共有情報の取得");
      if (!shareResponse.ok) throw new Error("shares/token → HTTP " + shareResponse.status);
      const share = await shareResponse.json();
      const token = share.accessToken;
      if (!token) throw new Error("共有のアクセストークンがありません");

      // 共有にはフォルダーを含められない（ファイルのみ）。製品トレースの「寸法を共有に含める」は
      // 索引と各図面の .trb をファイルとして共有に入れるので、まず共有のファイル一覧から探す。
      const found = (await findAnnotationsInShare(share, token)) || (await findAnnotationsFolder(share, token));
      if (!found) {
        log("寸法: Annotations_Index.json が見つかりません（共有リンクに製品図の寸法が含まれていません）");
        return;
      }
      const index = found.index;
      const guids = await productGuids(ids);
      const matches = (index.drawings || []).filter(d =>
        Object.keys(d.modelObjectDrawingObjects || {}).concat(d.mainObjects || [])
          .some(g => guids.has(String(g)) || guids.has(String(g).toLowerCase())));
      log("寸法: 索引の図面 " + (index.drawings || []).length + " 枚、この製品の図面 " + matches.map(d => d.name).join(", "));
      if (!matches.length) return;

      // 製品図（Assembly）を優先する
      const drawing = matches.find(d => /assembly/i.test(d.folder || "")) || matches[0];
      const trb = await found.findTrb(drawing);
      if (!trb) {
        log("寸法: TRB ファイルが見つかりません:", drawing.folder + "/" + drawing.file);
        return;
      }
      annotation = { id: "annotation-" + (drawing.drawingID || trb.id), name: drawing.name, fileId: trb.id, token,
        shared: (share.objects || []).some(o => o.id === trb.id) };
      el.dim.title = "製品図「" + drawing.name + "」の寸法を表示します";
      el.dim.hidden = false;
    } catch (e) {
      log("寸法を確認できません:", String(e && e.message || e));
    }
  }

  async function toggleAnnotation() {
    if (!annotation) return;
    el.dim.disabled = true;
    try {
      const show = !annotationVisible;
      if (annotation.shared && annotation.mode !== "blob") {
        // 共有に含まれるファイルは、ビューアのモデルとして開く／閉じる
        el.dim.textContent = show ? "寸法を読み込み中…" : "寸法表示";
        try {
          if (show) allowedModels.add(annotation.fileId); else allowedModels.delete(annotation.fileId);
          await api.viewer.toggleModel(annotation.fileId, show, false);
          annotationVisible = show;
          annotation.mode = "model";
        } catch (e) {
          log("toggleModel できないため、ダウンロードして表示します:", String(e && e.message || e));
          annotation.mode = "blob";
        }
      }
      if (!annotation.shared || annotation.mode === "blob") {
        if (!annotationLoaded) {
          el.dim.textContent = "寸法を読み込み中…";
          const blob = await (await fetch(await downloadUrl(annotation.fileId, annotation.token))).blob();
          await api.viewer.addTrimbimModel({ id: annotation.id, trbBlob: blob, visible: true });
          annotationLoaded = true;
          annotationVisible = true;
        } else {
          annotationVisible = show;
          // 表示の切り替えだけなら blob を渡さない（再読み込みを避ける）
          await api.viewer.addTrimbimModel({ id: annotation.id, visible: annotationVisible });
        }
      }
    } catch (e) {
      log("寸法を表示できません:", String(e && e.message || e));
      setStatus("寸法を表示できませんでした", String(e && e.message || e), true);
    } finally {
      el.dim.disabled = false;
      el.dim.textContent = "寸法表示";
      el.dim.setAttribute("aria-pressed", String(annotationVisible));
    }
  }

  // ---- 表示 ----

  function selector(ids) {
    return { modelObjectIds: [{ modelId: mid, objectRuntimeIds: ids }] };
  }

  /** ボルトの表示名。NAME（M20x95-TCB）→ 径と長さ → 規格の順に使う。 */
  function boltSpec(obj) {
    const props = new Map(flatProps(obj).map(p => [p.name, p.value]));
    const name = String(props.get("NAME") || "").trim();
    if (name) {
      return name
        .replace(/(\d)x(\d)/i, "$1×$2")
        .replace(/-(TCB|HTB)$/i, (_, type) => " " + BOLT_GRADES[type.toUpperCase()])
        .replace(/-/g, " ");
    }
    const round = v => Math.round(Number(v) * 10) / 10;
    const diameter = props.get("DIAMETER");
    const length = props.get("LENGTH");
    if (diameter && length) return `M${round(diameter)}×${round(length)}`;
    const standard = String(props.get("BOLT_STANDARD") || "").trim();
    return [standard || BOLT_GROUP, length ? `L${round(length)}` : ""].filter(Boolean).join(" ");
  }

  /** 製品の実体の子からボルトを集める（ボルトには ASSEMBLY_POS が無いため、階層から取得する）。 */
  async function loadBolts() {
    for (const [mark, node] of markTree) {
      const entityIds = assemblyEntities.get(mark);
      if (!entityIds) continue;
      const children = await withTimeout(
        api.viewer.getHierarchyChildren(mid, entityIds, HIERARCHY_ELEMENT_ASSEMBLY, false), 30000, "ボルト情報の取得");
      for (const child of children || []) {
        const obj = objectsById.get(child.id);
        if (!obj || !isBolt(obj)) continue;
        const spec = boltSpec(obj);
        if (!node.bolts.has(spec)) node.bolts.set(spec, { ids: [], count: 0 });
        const group = node.bolts.get(spec);
        group.ids.push(obj.id);
        const number = Number(new Map(flatProps(obj).map(p => [p.name, p.value])).get("NUMBER"));
        group.count += number > 0 ? number : 1;
      }
    }
  }

  const compareMarks = (a, b) =>
    (a === NO_MARK) - (b === NO_MARK) || a.localeCompare(b, undefined, { numeric: true });

  const ZOOM_SETTING_KEY = "qr-viewer.zoomOnClick";
  let activeRow = null;
  let labelIds = [];
  let selectionRequest = 0;

  function setActiveRow(row) {
    if (activeRow) activeRow.classList.remove("active");
    activeRow = row;
    if (row) row.classList.add("active");
  }

  /** リストで選択した対象を強調し、必要ならズームして、マークを表示する。 */
  async function selectFromList(ids, labelSpec) {
    const request = ++selectionRequest;
    await api.viewer.setSelection(selector(ids), "set");
    if (el.zoom.checked) await api.viewer.setCamera(selector(ids));
    await clearLabels();
    if (labelSpec && request === selectionRequest) await addLabels(labelSpec, ids, request);
  }

  /** 3D ビューの空白部分をクリックして選択が解除されたら、マークも消す。 */
  function onSelectionChanged(selection) {
    const count = (selection || []).reduce((sum, m) => sum + (m.objectRuntimeIds || []).length, 0);
    log("選択:", count);
    if (count > 0) return;
    selectionRequest++;
    setActiveRow(null);
    clearLabels().catch(e => log("clearLabels:", String(e)));
  }

  async function clearLabels() {
    const ids = labelIds;
    labelIds = [];
    if (ids.length) await api.markup.removeMarkups(ids);
  }

  /**
   * マークを表示する。labelSpec.targets は表示先のオブジェクト ID（同じマークが複数あれば、それぞれに表示）。
   * 外形を取得できない場合は、選択した対象全体の中心に 1 つ表示する。
   */
  async function addLabels(labelSpec, ids, request) {
    const markups = [];
    for (const id of labelSpec.targets.slice(0, MAX_LABELS)) {
      const size = await measureGroup([id]);
      if (size) markups.push(createLabel(labelSpec, size));
    }
    if (!markups.length) {
      const size = await measureGroup(ids);
      if (size) markups.push(createLabel(labelSpec, size));
    }
    if (!markups.length || request !== selectionRequest) return;
    const added = await api.markup.addTextMarkup(markups);
    const addedIds = (added || []).map(m => m.id);
    // 追加を待っている間に別の行が選択された場合は、この結果を残さない
    if (request === selectionRequest) labelIds = addedIds;
    else if (addedIds.length) await api.markup.removeMarkups(addedIds);
  }

  function initZoomOption() {
    try { el.zoom.checked = localStorage.getItem(ZOOM_SETTING_KEY) === "1"; } catch (e) { /* 保存できない環境 */ }
    el.zoom.addEventListener("change", () => {
      try { localStorage.setItem(ZOOM_SETTING_KEY, el.zoom.checked ? "1" : "0"); } catch (e) { /* 保存できない環境 */ }
    });
  }

  function createRow(text, ids, className, count, labelSpec) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "row " + className;
    const name = document.createElement("span");
    name.textContent = text;
    const countEl = document.createElement("span");
    countEl.className = "count";
    countEl.textContent = "×" + count;
    row.append(name, countEl);
    row.addEventListener("click", event => {
      event.preventDefault();  // summary 内のクリックで開閉しないようにする
      setActiveRow(row);
      selectFromList(ids, labelSpec).catch(e => log("select:", String(e)));
    });
    return row;
  }

  function createBoltList(bolts) {
    const details = document.createElement("details");
    details.open = true;
    details.className = "bolts";
    const summary = document.createElement("summary");
    summary.textContent = BOLT_GROUP;
    const list = document.createElement("ul");
    for (const spec of Array.from(bolts.keys()).sort(compareMarks)) {
      const { ids, count } = bolts.get(spec);
      const item = document.createElement("li");
      item.append(createRow(spec, ids, "part", count,
        { text: spec, color: PART_LABEL_COLOR, leader: true, targets: ids }));
      list.append(item);
    }
    details.append(summary, list);
    return details;
  }

  /** 右側のリスト（製品 → 部材・ボルト）を作る。 */
  function buildMarkList() {
    const assemblies = Array.from(markTree.keys()).sort(compareMarks);
    for (const assemblyMark of assemblies) {
      const node = markTree.get(assemblyMark);
      const details = document.createElement("details");
      details.open = assemblies.length === 1;
      const summary = document.createElement("summary");
      const partCount = Array.from(node.parts.values()).reduce((sum, ids) => sum + ids.length, 0);
      const entities = assemblyEntities.get(assemblyMark) || [];
      const name = displayNames.get(assemblyMark) || assemblyMark;
      summary.append(createRow(name, node.ids, "assembly", partCount,
        { text: name, color: ASSEMBLY_LABEL_COLOR, leader: false, targets: entities }));
      const list = document.createElement("ul");
      for (const partMark of Array.from(node.parts.keys()).sort(compareMarks)) {
        const ids = node.parts.get(partMark);
        const item = document.createElement("li");
        item.append(createRow(partMark, ids, "part", ids.length, partMark === NO_MARK ? null
          : { text: partMark, color: PART_LABEL_COLOR, leader: true, targets: ids }));
        list.append(item);
      }
      details.append(summary, list);
      if (node.bolts.size) details.append(createBoltList(node.bolts));
      el.panel.append(details);
    }
    initZoomOption();
    el.list.hidden = false;
    // 幅の狭い画面（スマートフォン）ではモデルを優先し、リストは閉じておく
    setPanelOpen(window.matchMedia("(min-width: 701px)").matches);
  }

  function setPanelOpen(open) {
    el.panel.hidden = !open;
    el.list.setAttribute("aria-expanded", String(open));
  }

  async function showMatches() {
    setActiveRow(null);
    selectionRequest++;
    await clearLabels();
    await api.viewer.setSelection(selector(matched), "set");
    if (isolate) {
      await api.viewer.isolateEntities([{ modelId: mid, entityIds: matched }]);
    }
    await api.viewer.setCamera(selector(matched));
  }

  /** マークごとの外形（ビューアの座標、メートル）を合成して中心と対角長を求める。 */
  async function measureGroup(ids) {
    const boxes = [];
    for (let i = 0; i < ids.length; i += PROPERTY_BATCH) {
      boxes.push(...await withTimeout(
        api.viewer.getObjectBoundingBoxes(mid, ids.slice(i, i + PROPERTY_BATCH)), 30000, "外形の取得"));
    }
    const min = { x: Infinity, y: Infinity, z: Infinity };
    const max = { x: -Infinity, y: -Infinity, z: -Infinity };
    for (const { boundingBox: b } of boxes) {
      if (!b || !b.min || !b.max) continue;
      for (const axis of ["x", "y", "z"]) {
        if (!isFinite(b.min[axis]) || !isFinite(b.max[axis])) continue;
        min[axis] = Math.min(min[axis], b.min[axis]);
        max[axis] = Math.max(max[axis], b.max[axis]);
      }
    }
    if (!(min.x <= max.x && min.y <= max.y && min.z <= max.z)) return null;
    log("外形:", { min, max });
    return {
      center: { x: (min.x + max.x) / 2, y: (min.y + max.y) / 2, z: (min.z + max.z) / 2 },
      diagonal: Math.hypot(max.x - min.x, max.y - min.y, max.z - min.z),
    };
  }

  /** labelSpec.leader が false のときは引き出し線なし（文字だけ）にする。 */
  function createLabel(labelSpec, size) {
    const start = {
      positionX: size.center.x * METERS_TO_MM,
      positionY: size.center.y * METERS_TO_MM,
      positionZ: size.center.z * METERS_TO_MM,
    };
    // 文字は引き出し線の終点に付くので、外形に応じた長さだけずらす
    const leader = labelSpec.leader
      ? Math.max(LABEL_MIN_LEADER_MM, Math.min(LABEL_MAX_LEADER_MM, size.diagonal * METERS_TO_MM * 0.05))
      : 0;
    return {
      text: labelSpec.text,
      color: labelSpec.color,
      start,
      end: { positionX: start.positionX + leader, positionY: start.positionY - leader, positionZ: start.positionZ },
    };
  }

  async function showAll() {
    try {
      await api.viewer.setObjectState(undefined, { visible: "reset" });
      await api.viewer.setCamera("reset");
    } catch (e) {
      log("showAll:", String(e));
    }
  }

  // 「対象を表示」でスキャンした製品に戻したら、状態表示も元に戻す
  let resultStatus = null;
  el.focus.addEventListener("click", () => showMatches()
    .then(() => { if (resultStatus) setStatus(...resultStatus); })
    .catch(e => log("focus:", String(e))));
  el.all.addEventListener("click", showAll);
  el.same.addEventListener("click", () => showSameMark());
  el.dim.addEventListener("click", () => toggleAnnotation());
  el.list.addEventListener("click", () => setPanelOpen(el.panel.hidden));

  // ---- メイン ----

  async function main() {
    if (!pid || !mid) {
      fail("QR コードのリンクが正しくありません（pid / mid がありません）。");
      return;
    }
    if (!stoken) {
      // 公開トークンが無い場合はログインが必要なので、Trimble Connect のビューアへ移動する
      setStatus("Trimble Connect に移動しています…");
      location.replace(viewerUrl);
      return;
    }
    if (typeof TrimbleConnectWorkspace === "undefined") {
      fail("Trimble Connect の API を読み込めませんでした。通信状態を確認してください。");
      return;
    }

    try {
      setStatus("Trimble Connect に接続しています…", label ? "対象: " + label : "");
      await withTimeout(connectViewer(), 60000, "Trimble Connect への接続");
      log("connected, mode =", mode);
      try { await api.ui.setUI({ name: "SidePanel", state: "collapsed" }); } catch (e) { /* 任意 */ }

      setStatus("モデルを読み込んでいます…", label ? "対象: " + label : "");
      await waitForModel(60000);
      // イベントを取り逃した場合に備えて、モデル以外に開いている共有ファイルを閉じる
      try {
        for (const m of await api.viewer.getModels("loaded") || []) hideExtraModel({ id: m.id, name: m.name, state: "loaded" });
      } catch (e) { /* 任意 */ }
    } catch (e) {
      if (mode === "api") {
        // 埋め込み方式を切り替えて再試行する
        log("api mode failed, retry with url mode:", String(e));
        q.set("mode", "url");
        // フラグメントだけの変更ではページが再読み込みされないため、明示的に再読み込みする
        history.replaceState(null, "", location.pathname + "#" + q.toString());
        location.reload();
        return;
      }
      fail("モデルを表示できませんでした。", e);
      return;
    }

    if (!apos.length && !ppos.length && !guids.length) {
      busy(false);
      setStatus("モデルを表示しています");
      el.open.hidden = false;
      return;
    }

    try {
      // 1. GUID で 1 個だけを特定する
      let foundBy = "";
      if (guids.length) {
        setStatus("製品を特定しています…", "対象: " + label);
        matched = await findByGuid();
        if (matched.length) foundBy = "guid";
        else log("GUID で見つかりませんでした。マークで検索します。");
      }
      // 2. 見つからなければ（または GUID が無い QR なら）マークで検索する
      if (!matched.length && (apos.length || ppos.length)) {
        setStatus("対象を検索しています…", "対象: " + markLabel);
        const objects = await loadObjectsWithProperties();
        matched = findMatches(objects);
        if (matched.length) foundBy = "mark";
      }
      busy(false);
      el.open.hidden = false;
      if (!matched.length) {
        setStatus("対象が見つかりませんでした: " + label,
          "モデル全体を表示しています。（Trimble Connect のモデルにこの製品が含まれていない可能性があります）", true);
        return;
      }
      try {
        await loadBolts();
      } catch (e) {
        // ボルトは補助情報なので、取得できなくても表示は続ける
        log("ボルト情報を取得できませんでした:", String(e && e.message || e));
      }
      buildMarkList();
      await showMatches();
      const partCount = matched.filter(id => {
        const obj = objectsById.get(id);
        return obj && !isAssemblyEntity(obj) && !isBolt(obj);
      }).length;
      if (foundBy === "guid") {
        setStatus(label + " を表示しています", "GUID で特定・部材 " + partCount + " 件");
      } else if (guids.length) {
        // 個体指定の QR だが GUID が見つからなかった（モデルが古い・作り直した等）
        // assemblyEntities にはモデル内のすべての製品が入っているので、一致した符号の分だけ数える
        const products = Array.from(markTree.keys()).reduce((sum, mark) => sum + (assemblyEntities.get(mark) || []).length, 0);
        setStatus(markLabel + " を表示しています",
          "この QR の製品（GUID）がモデルに無いため、同じ製品符号の製品" + (products ? " " + products + " 個" : "") +
          "を表示しています。Trimble Connect のモデルが最新か確認してください。", true);
      } else {
        setStatus(label + " を表示しています", "部材 " + partCount + " 件");
      }
      resultStatus = [el.status.firstChild ? el.status.firstChild.textContent : "",
        el.status.querySelector("small") ? el.status.querySelector("small").textContent : "",
        el.status.className === "error"];
      el.focus.hidden = false;
      el.all.hidden = false;
      el.same.hidden = !(foundBy === "guid" && apos.length);
      // 製品図の寸法が公開されているかを裏で確認し、あればボタンを出す
      checkAnnotations(matched);
    } catch (e) {
      fail("対象を表示できませんでした。", e);
    }
  }

  main();
})();
</script>
